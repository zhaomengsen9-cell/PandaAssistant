server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: panda-assistant-backend
  datasource:
    url: ${DB_URL:jdbc:h2:mem:panda_assistant;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  algorithm:
    mode: ${ALGORITHM_MODE:stub}
    llama-index:
      base-url: ${LLAMA_INDEX_BASE_URL:http://localhost:8001}
      timeout: ${LLAMA_INDEX_TIMEOUT:60s}
